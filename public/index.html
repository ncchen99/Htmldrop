<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>htmldrop — 把 HTML 變成一個連結</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<a class="skip-link" href="#main">跳到主要內容</a>

<header class="site-header">
  <span class="wordmark">
    <svg class="wordmark-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 3v10m0 0 3.5-3.5M12 13 8.5 9.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
    </svg>
    htmldrop
  </span>
  <button type="button" class="ghost-btn" id="signOutBtn" hidden>清除密碼</button>
</header>

<main id="main">

  <!-- ── 密碼關卡 ───────────────────────────────────────────── -->
  <section class="card gate" id="gate" hidden>
    <h1 class="gate-title">輸入上傳密碼</h1>
    <p class="gate-sub">只需輸入一次，之後這台裝置會記住。</p>
    <form id="gateForm" class="gate-form">
      <label class="sr-only" for="keyInput">上傳密碼</label>
      <input class="input" type="password" id="keyInput" autocomplete="current-password"
             placeholder="上傳密碼" required>
      <button class="btn btn-primary" type="submit">開始使用</button>
    </form>
    <p class="msg msg-error" id="gateError" role="alert" hidden></p>
  </section>

  <!-- ── 主要流程 ───────────────────────────────────────────── -->
  <section class="stage" id="stage" hidden>

    <!-- 步驟 1：丟檔案 -->
    <div id="dropView">
      <h1 class="title">把 HTML 變成一個連結</h1>
      <p class="subtitle">丟進來，馬上得到可以傳給別人的網址。</p>

      <button type="button" class="dropzone" id="dropzone">
        <svg class="dropzone-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.5 16.5v2A2.5 2.5 0 0 0 6 21h12a2.5 2.5 0 0 0 2.5-2.5v-2" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
        <span class="dropzone-title">把 HTML 檔案拖進來</span>
        <span class="dropzone-hint">或點一下選檔案　·　也可以直接貼上原始碼</span>
      </button>
      <input type="file" id="fileInput" accept=".html,.htm,text/html" hidden>

      <div class="ttl-row">
        <span class="ttl-label" id="ttlLabel">保存期限</span>
        <div class="segmented" role="radiogroup" aria-labelledby="ttlLabel">
          <button type="button" class="seg" role="radio" data-ttl="w" aria-checked="false">7 天</button>
          <button type="button" class="seg" role="radio" data-ttl="m" aria-checked="true">30 天</button>
          <button type="button" class="seg" role="radio" data-ttl="p" aria-checked="false">永久</button>
        </div>
      </div>
    </div>

    <!-- 步驟 2：上傳中 -->
    <div class="card busy" id="busyView" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <p class="busy-text" id="busyText">上傳中…</p>
    </div>

    <!-- 步驟 3：完成 -->
    <div class="card result" id="resultView" hidden>
      <div class="result-head">
        <svg class="result-check" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.75"/>
          <path d="m8.25 12.25 2.5 2.5 5-5.5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h2 class="result-title" id="resultTitle">已經可以分享了</h2>
      </div>

      <div class="link-row">
        <input class="input link-input" id="resultUrl" readonly aria-label="分享連結">
        <button type="button" class="btn btn-primary" id="copyBtn">複製</button>
      </div>

      <p class="result-meta" id="resultMeta"></p>

      <div class="result-actions">
        <a class="btn btn-quiet" id="openBtn" target="_blank" rel="noopener noreferrer">開啟看看</a>
        <button type="button" class="btn btn-quiet" id="againBtn">再傳一個</button>
      </div>
    </div>

    <p class="msg msg-error" id="uploadError" role="alert" hidden></p>

    <!-- 最近分享 -->
    <section class="history" id="history" hidden>
      <div class="history-head">
        <h2 class="history-title">最近分享</h2>
        <button type="button" class="ghost-btn" id="clearHistoryBtn">清空紀錄</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
      <p class="history-note">紀錄只存在這台裝置的瀏覽器裡。</p>
    </section>

  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/app.js"></script>
</body>
</html>
